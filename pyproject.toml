[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthv-assistant"
version = "0.1.0"
description = "Synthesizer V Studio 2 本地调教与听音助手"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "mcp>=1.20,<2"]

[project.urls]
Repository = "https://github.com/blockshy/synthv-assistant"
Issues = "https://github.com/blockshy/synthv-assistant/issues"

[project.optional-dependencies]
test = ["lupa>=2.6,<3"]

[project.scripts]
synthv-assistant = "synthv_assistant.__main__:main"

[tool.setuptools]
packages = ["synthv_assistant"]
